AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sanshin Tameike Frontend

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - dev-alfa
      - staging
      - production
    Description: Environment name for deployment
  
  SensorApiUrl:
    Type: String
    Default: "https://k64l2ssaj3.execute-api.ap-northeast-1.amazonaws.com/dev"
    Description: Sensor API Base URL
  
  SensorApiKey:
    Type: String
    NoEcho: true
    Default: "sM2TijRJJM4ofENmJzEzd3itfGMTiKtp8KYF6TSp"
    Description: Sensor API Key

Globals:
  Function:
    Timeout: 30

Resources:
  SanshinTameikeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sanshin-tameike-frontend-${Environment}"
      CodeUri: ./
      MemorySize: 1024
      PackageType: Image
      Architectures:
        - x86_64
      # 環境変数の設定
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          NODE_ENV: production
          # Supabase環境変数（ダミー値で一時的に対応）
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"
          # センサーAPI環境変数（追加）
          NEXT_PUBLIC_SENSOR_API_URL: !Ref SensorApiUrl
          NEXT_PUBLIC_SENSOR_API_KEY: !Ref SensorApiKey
          # 追加の環境変数
          NEXT_PUBLIC_APP_NAME: "Sanshin Edge Vision"
          NEXT_PUBLIC_APP_VERSION: "1.0.0"
      Events:
        RootEvent:
          Type: HttpApi
          Properties:
            Path: /
            Method: any
        ProxyEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: any
    Metadata:
      DockerTag: !Sub "sanshin-tameike-frontend-v1-${Environment}"
      DockerContext: ./
      Dockerfile: Dockerfile

Outputs:
  SanshinTameikeFrontendURL:
    Description: "API Gateway endpoint URL for Sanshin Tameike Frontend"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  
  FunctionName:
    Description: "Lambda Function Name"
    Value: !Ref SanshinTameikeFunction
    
  Environment:
    Description: "Deployment Environment"
    Value: !Ref Environment
  
  SensorApiUrl:
    Description: "Configured Sensor API URL"
    Value: !Ref SensorApiUrl